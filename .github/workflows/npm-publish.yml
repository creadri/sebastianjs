name: npm-publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci
        env:
          # Publishing needs no browser: the Chrome parity tests skip themselves
          # when mermaid-cli or the Open Sans system font is unavailable, which
          # is the case on a bare runner. Skipping the download saves pulling
          # ~100MB of Chromium on every publish.
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Test
        run: npm test --silent
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
