name: deploy-pages

on:
  # Only on a release tag. The site embeds benchmark and parity figures, so
  # building it from arbitrary main commits publishes numbers that describe no
  # released version. workflow_dispatch stays for rebuilding on demand.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: npm ci

      # The reference pane is real mermaid-cli output, and mermaid-cli measures
      # text through fontconfig. Without Open Sans installed as a system font
      # Chrome silently substitutes another face, every width shifts, and the
      # whole gallery reports differences that are really a font substitution.
      # SebastianJS reads the same TTFs straight from fonts/, so only the
      # Chrome side needs this. Mirrors .devcontainer/setup.sh.
      - name: Install Open Sans for the mermaid-cli reference
        run: |
          mkdir -p "$HOME/.local/share/fonts/sebastianjs"
          cp fonts/Open_Sans/static/OpenSans-Regular.ttf \
             fonts/Open_Sans/static/OpenSans-Bold.ttf \
             fonts/Open_Sans/static/OpenSans-Italic.ttf \
             fonts/Open_Sans/static/OpenSans-BoldItalic.ttf \
             "$HOME/.local/share/fonts/sebastianjs/"
          fc-cache -f
          fc-match "Open Sans" --format "%{family}\n"

      - name: Build site
        run: npm run build:site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
