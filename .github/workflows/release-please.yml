name: release-please

on:
  # Not on every commit to main.
  #
  # Caveat worth knowing: release-please is designed to watch main and keep a
  # release PR open, and merging that PR is what creates the tag. Running it
  # *from* a tag inverts that -- by the time it fires, the release it would
  # have proposed already exists, so it can only open a PR for the next one.
  # workflow_dispatch is the trigger that will actually do useful work here.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          # this is a built-in strategy in release-please, see "Action Inputs"
          # for more options
          release-type: node
